services:
  postgres:
    image: postgres:18.4-alpine
    env_file:
      - "config.env"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5434:5432"
  backend:
    env_file:
      - "config.env"
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
  market:
    env_file:
      - "config.env"
    build:
      context: ../market
      dockerfile: Dockerfile
    ports:
      - "8081:8081"