version: "2"
sql:
  - engine: "postgresql"
    schema: "../../migrations"
    queries: "queries"
    gen:
      go:
        package: "rdb"
        out: "."
        sql_package: "pgx/v5"
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"

          - db_type: "text"
            go_type: "string"
          - db_type: "text"
            nullable: true
            go_type:
              pointer: true
              type: "string"

          - db_type: "date"
            nullable: true
            go_type:
              pointer: true
              import: "time"
              type: "Time"
          - db_type: "date"
            go_type: "time.Time"

          - db_type: "pg_catalog.int4"
            nullable: true
            go_type:
              pointer: true
              type: "int"
          - db_type: "pg_catalog.int4"
            go_type: "int"